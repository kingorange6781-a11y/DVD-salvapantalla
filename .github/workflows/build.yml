name: Build Android APK

on:
  push:
    branches: [ "main", "master", "actualizacion-de-mi-codigo" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [published]    # <--- ¡Esta es la clave para que detecte tus releases!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Compilar APK Debug
      run: gradle assembleDebug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: DVD-SalvaPantallas-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
